<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#E63946" />
    <meta name="description" content="Grand Aceh Kuliner POS — Hybrid F&B + Retail" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
    <title>Grand Aceh Kuliner POS</title>
    <!-- Overlay error: kalau ada error saat app dimuat (mis. WebView terlalu tua),
         tampilkan pesan di layar + tombol Salin & Kirim ke VibeCoder (tanpa React).
         ES5 murni (var/function/XMLHttpRequest) supaya jalan di WebView paling tua. -->
    <script>
      (function () {
        var lastError = "";
        function escHtml(s) {
          return String(s || "").replace(/[&<>"']/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
          });
        }
        function setStatus(t) {
          var s = document.getElementById("gak-err-status");
          if (s) s.textContent = " " + t;
        }
        function copyText(t) {
          try {
            var ta = document.createElement("textarea");
            ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
            document.body.appendChild(ta); ta.select();
            document.execCommand("copy");
            document.body.removeChild(ta);
          } catch (e) {}
        }
        function sendError() {
          setStatus("Mengirim...");
          var report = "=== ERROR OVERLAY Grand Aceh Kuliner POS ===\n"
            + "Waktu: " + new Date().toLocaleString("id-ID") + "\n"
            + "Pesan: " + lastError + "\n"
            + "URL: " + window.location.href + "\n"
            + "UA: " + navigator.userAgent;
          var body = JSON.stringify({ ts: new Date().toISOString(), report: report });
          var xhr = new XMLHttpRequest();
          xhr.open("POST", "https://taqim258.vibecoder.co.id/pos-grand-update/rpt.php", true);
          xhr.setRequestHeader("Content-Type", "application/json");
          xhr.setRequestHeader("X-Gak-Token", "gak_rpt_7f3c9e1b");
          xhr.onreadystatechange = function () {
            if (xhr.readyState === 4) {
              if (xhr.status === 200) setStatus("Terkirim ✓");
              else setStatus("Gagal (HTTP " + xhr.status + ")");
            }
          };
          xhr.onerror = function () { setStatus("Gagal (jaringan)"); };
          xhr.send(body);
        }
        function show(msg, extra) {
          lastError = msg + (extra ? "\n" + extra : "");
          var d = document.getElementById("gak-error-overlay");
          if (!d) {
            d = document.createElement("div");
            d.id = "gak-error-overlay";
            d.style.cssText = "position:fixed;inset:0;z-index:99999;background:#FEF2F2;color:#B91C1C;font:14px/1.5 system-ui,sans-serif;padding:24px;overflow:auto;white-space:pre-wrap";
            document.body.appendChild(d);
          }
          var btn = "padding:10px 16px;border:0;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;margin-right:8px";
          d.innerHTML = "<div style='font-size:18px;font-weight:700;margin-bottom:10px'>Terjadi kesalahan saat memuat aplikasi</div>"
            + "<div style='margin-bottom:14px'>" + escHtml(lastError) + "</div>"
            + "<button id='gak-err-copy' style='" + btn + "background:#fff;color:#B91C1C;border:1px solid #B91C1C'>Salin Pesan</button>"
            + "<button id='gak-err-send' style='" + btn + "background:#4F46E5;color:#fff'>Kirim ke VibeCoder</button>"
            + "<span id='gak-err-status' style='font-size:13px'></span>";
          var copyBtn = document.getElementById("gak-err-copy");
          if (copyBtn) copyBtn.onclick = function () {
            copyText(lastError + "\n\nUA: " + navigator.userAgent + "\nURL: " + window.location.href);
            setStatus("Disalin ✓ (tempel ke chat)");
          };
          var sendBtn = document.getElementById("gak-err-send");
          if (sendBtn) sendBtn.onclick = sendError;
        }
        window.addEventListener("error", function (e) {
          show((e && e.message) || "Unknown error", (e && e.filename) ? (e.filename + ":" + e.lineno) : "");
        });
        window.addEventListener("unhandledrejection", function (e) {
          var r = e && e.reason; var m = "";
          try { m = (r && r.message) || String(r); } catch (x) {}
          show("Promise rejected: " + m, "");
        });
      })();
    </script>
    <script src="%PUBLIC_URL%/polyfills.js"></script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
