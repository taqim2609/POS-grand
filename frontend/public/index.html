<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#E63946" />
    <meta name="description" content="Grand Aceh Kuliner POS — Hybrid F&B + Retail" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
    <title>Grand Aceh Kuliner POS</title>
    <!-- Polyfill WebView lama (Android 7 / API 24): WAJIB di-load sebelum bundle utama -->
    <script>
      /* Overlay error: kalau ada error saat app dimuat (mis. WebView terlalu tua),
         tampilkan pesan di layar — jangan blank diam-diam. ES5 murni. */
      (function () {
        function show(msg, extra) {
          try {
            var d = document.createElement("div");
            d.style.cssText = "position:fixed;inset:0;z-index:99999;background:#FEF2F2;color:#B91C1C;font:14px/1.5 system-ui,sans-serif;padding:24px;overflow:auto;white-space:pre-wrap";
            d.textContent = "Terjadi kesalahan saat memuat aplikasi.\n" + msg + (extra ? "\n\n" + extra : "");
            document.body.appendChild(d);
          } catch (e) {}
        }
        window.addEventListener("error", function (e) {
          show((e && e.message) || "Unknown error", (e && (e.filename + ":" + e.lineno)) || "");
        });
        window.addEventListener("unhandledrejection", function (e) {
          var r = e && e.reason; var m = "";
          try { m = (r && r.message) || String(r); } catch (x) {}
          show("Promise rejected: " + m, "");
        });
      })();
    </script>
    <script src="%PUBLIC_URL%/polyfills.js"></script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
