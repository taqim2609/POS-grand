server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;

    # CORS — dipakai lokasi yang TIDAK punya add_header sendiri.
    # CATATAN: nginx TIDAK mewariskan add_header dari server ke lokasi yang
    # mendefinisikan add_header sendiri, jadi tiap lokasi penting (/ota/, /static/,
    # /index.html) menyertakan header CORS secara eksplisit.
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Gak-Token" always;

    # Kompresi -> hemat bandwidth & meringankan transfer server Pi
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml font/ttf font/woff font/woff2;

    # API proxy ke backend (satu origin -> tanpa masalah CORS di browser).
    # CORS preflight ditangani FastAPI (CORSMiddleware).
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Aset ber-hash (CRA /static/*) -> cache permanen "immutable".
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Gak-Token" always;
        access_log off;
        try_files $uri =404;
    }

    # Bundle OTA -> jangan di-cache + WAJIB CORS (dipakai APK cross-origin).
    location /ota/ {
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Gak-Token" always;
        # Preflight OPTIONS (browser/WebView) -> jawab langsung 204
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # index.html -> selalu revalidate agar update selalu masuk (tidak nyangkut versi lama).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Gak-Token" always;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
