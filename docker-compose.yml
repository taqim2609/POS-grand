# Grand Aceh Kuliner POS — paket server lokal (LAN).
# Jalankan semua di 1 komputer:  docker compose up -d --build
# Akses dari POS komputer / Android:  http://<IP-KOMPUTER-SERVER>

services:
  mongo:
    # Windows / PC x86  -> mongo:7 (default).
    # Raspberry Pi 3/4 (ARMv8.0-A) -> set MONGO_IMAGE=mongo:4.4.18 di .env
    #   (versi 4.4.19+ & 5.0+ butuh ARMv8.2-A -> crash "Illegal Instruction" di Pi 3/4)
    image: ${MONGO_IMAGE:-mongo:7}
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    # Port TIDAK diekspos ke luar; hanya diakses backend di jaringan internal Docker.

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.docker
    environment:
      - HOST_PROJECT_DIR=${HOST_PROJECT_DIR:-}
      - UPDATER_IMAGE=${UPDATER_IMAGE:-docker:cli}
    depends_on:
      - mongo
    volumes:
      - uploads_data:/app/uploads   # gambar AI & unggahan tersimpan permanen
      - /var/run/docker.sock:/var/run/docker.sock   # untuk tombol "Update Sekarang" (1-klik)
      - ${HOST_PROJECT_DIR:-.}:/host-project:ro   # baca .vibecoder-version (versi terpasang)

  whatsapp:
    build: ./whatsapp-service
    restart: unless-stopped
    environment:
      - CHROME_BIN=/usr/bin/chromium
      - WA_SECRET=${WA_SECRET:-gak_wa_5f3c1e7b2d84a6f0}
      - PORT=3001
    volumes:
      - wa_auth:/app/whatsapp-service/.wwebjs_auth   # sesi WhatsApp tersimpan
    # DINONAKTIFKAN: notifikasi WhatsApp kini via wacloud.id (HTTP API, tanpa Chromium).
    # Layanan berat ini hanya nyala bila profil "legacy-wa" diaktifkan secara khusus.
    profiles: ["legacy-wa"]

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: ""   # kosong = pakai /api relatif (satu origin via nginx)
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data:
  uploads_data:
  wa_auth:
